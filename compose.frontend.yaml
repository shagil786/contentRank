services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}
        APP_URL: ${APP_URL:-https://content-rank.lol}
    env_file:
      - /opt/contentrank/backend/.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      APP_URL: https://content-rank.lol
      REALTIME_BASE_URL: http://backend-realtime-1:3004
    networks:
      - backend_default
    restart: unless-stopped

networks:
  backend_default:
    external: true
